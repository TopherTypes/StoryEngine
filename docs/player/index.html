<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StoryEngine - Story Player">
  <title>StoryEngine - Story Player</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/player.css">
</head>
<body>
  <!-- Initial Loading State -->
  <div id="loadingScreen" class="screen">
    <div class="loading-container">
      <h1>⚙️ STORYENGINE PLAYER ⚙️</h1>
      <p class="tagline">&gt; Loading story...</p>
    </div>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen" class="screen" style="display: none;">
    <div class="login-container">
      <h1 id="storyTitle"></h1>
      <p id="storyDescription"></p>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p id="loginError" class="error" style="display: none;"></p>
    </div>
  </div>

  <!-- Desktop Environment -->
  <div id="desktopScreen" class="screen" style="display: none;">
    <!-- Desktop -->
    <div id="desktop" class="desktop">
      <!-- Window Container -->
      <div id="windowContainer" class="window-container"></div>

      <!-- Taskbar -->
      <div id="taskbar" class="taskbar">
        <div class="taskbar-icons">
          <button class="taskbar-btn" data-app="email" title="Email">📧</button>
          <button class="taskbar-btn" data-app="im" title="Instant Messenger">💬</button>
        </div>
        <div class="taskbar-time" id="taskbarTime">0:00</div>
        <button id="resetBtn" class="taskbar-btn" title="Reset Story">🔄</button>
      </div>
    </div>
  </div>

  <!-- Ending Screen -->
  <div id="endingScreen" class="screen" style="display: none;">
    <div class="ending-container">
      <h1 id="endingTitle"></h1>
      <img id="endingImage" style="display: none; max-width: 100%; margin: 2rem 0;">
      <div id="endingBody"></div>
      <div class="ending-actions">
        <button id="restartBtn" class="btn-primary">Restart Story</button>
        <button id="continueBtn" class="btn-secondary" style="display: none;">Continue Exploring</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
