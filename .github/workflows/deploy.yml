name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - run: |
          mkdir -p docs
          cp index.html docs/
          cp -r css authoring player .nojekyll docs/
        name: Copy static files to docs folder

      - run: ls -la docs/
        name: Verify docs folder contents

      - uses: EndBug/add-and-commit@v9
        with:
          add: 'docs'
          message: 'chore: deploy static site to docs folder [skip ci]'
          push: true
          default_author: github_actions
