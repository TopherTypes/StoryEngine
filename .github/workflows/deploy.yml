name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install

      - run: rm -rf index.html assets/ vite.svg
        name: Clean previous build output
        continue-on-error: true

      - run: npm run build
        env:
          NODE_ENV: production

      - run: ls -la index.html && ls -la assets/
        name: Verify build output

      - uses: EndBug/add-and-commit@v9
        with:
          add: 'index.html assets/ vite.svg'
          message: 'chore: build root directory [skip ci]'
          push: true
          default_author: github_actions
