name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install

      - run: npm run build
        env:
          NODE_ENV: production

      - run: ls -la docs/ && ls -la docs/assets/
        name: Verify build output

      - uses: EndBug/add-and-commit@v9
        with:
          add: 'docs'
          message: 'chore: build docs folder [skip ci]'
          push: true
          default_author: github_actions
